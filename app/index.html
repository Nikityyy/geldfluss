<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geldfluss</title>
<meta name="description" content="Sieh, wohin dein Geld fließt: Einnahmen, Fixkosten, Ausgaben und was übrig bleibt. Kostenlos, ohne Konto, alles bleibt in deinem Browser.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Geldfluss">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // The theme before the first paint, so dark mode never flashes light.
  try {
    var t = JSON.parse(localStorage.getItem('geldfluss:theme') || 'null');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt</a>
<div id="app" class="shell">
  <noscript><p style="padding:24px;max-width:40ch">Geldfluss braucht JavaScript. Es läuft komplett in deinem Browser, ohne Server.</p></noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
